name: ensiconnect
description: "A new Flutter project for ENSISA."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  firebase_core: ^4.10.0
  cloud_firestore: ^6.5.0
  table_calendar: ^3.2.0
  
  image_picker: ^1.2.2
  firebase_storage: ^13.4.2
  mailer: ^7.1.0
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

    # Configuration des assets (Images de l'application)
  assets:
    - assets/images/
